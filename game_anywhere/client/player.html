<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Play | GameAnywhere</title>
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/player.css" />
        <script src="wizard/wizard.js"></script>
        <link href="wizard/wizard-robe.css" rel="stylesheet" />
    </head>

    <body class="app-page">
        <header class="app-header">
            <a class="brand" href="index.html">Game Anywhere</a>
        </header>

        <main class="play-shell">
            <div class="play-grid">
                <aside class="sidebar">
                    <section class="connection-card">
                        <h2>Server Connection</h2>
                        <div class="meta-list">
                            <div class="meta-row">
                                <span>Status</span>
                                <strong id="connection-status"
                                    >Not connected</strong
                                >
                            </div>
                            <div class="meta-row">
                                <span>Player</span>
                                <strong id="display-username"></strong>
                            </div>
                        </div>
                        <form
                            class="join-form"
                            onsubmit="connectToServer(document.getElementById('serverUrl').value); return false;"
                        >
                            <div class="field">
                                <label for="serverUrl">Server address</label>
                                <input
                                    type="text"
                                    id="serverUrl"
                                    placeholder="localhost:8080"
                                />
                            </div>
                            <div class="field">
                                <label for="playerId">Seat number</label>
                                <input type="text" id="playerId" value="0" />
                            </div>
                            <div class="field">
                                <label for="roomId">Room ID</label>
                                <input
                                    type="text"
                                    id="roomId"
                                    placeholder="Enter room ID"
                                />
                            </div>
                            <button type="submit">Join room</button>
                        </form>
                    </section>

                    <section class="login-card">
                        <h2>Login</h2>
                        <form
                            id="login-form"
                            class="form-stack"
                            action="javascript:login()"
                        >
                            <div class="field">
                                <label for="login-username">Username</label>
                                <input
                                    id="login-username"
                                    name="username"
                                    type="text"
                                />
                            </div>
                            <button type="submit">Login</button>
                        </form>
                        <form
                            id="logout-form"
                            class="form-stack"
                            action="javascript:logout()"
                            hidden
                        >
                            <div class="status-line">
                                <span>Logged in as</span>
                                <strong id="login-display-username"></strong>
                            </div>
                            <button class="secondary" type="submit">
                                Log out
                            </button>
                        </form>
                    </section>
                </aside>

                <!-- Screen Panel -->
                <div id="screen-host">
                    <template shadowrootmode="open">
                        <link rel="stylesheet" href="css/player.css" />
                        <link rel="stylesheet" href="css/screen.css" />
                        <div id="screen">Game screen content goes here...</div>
                    </template>
                </div>

                <!-- Chat Log and Input -->
                <div id="logPanel">
                    <form
                        id="chatInput"
                        hidden
                        onsubmit="sendChatLine(this); return false;"
                    >
                        <input type="text" placeholder="Type a message..." />
                        <button type="submit">Send</button>
                    </form>
                </div>
            </div>
        </main>

        <div id="controlPanel" hidden></div>
        <script>
            const CHAT_CHARACTER = "<";

            const screen = document.getElementById("screen-host").shadowRoot;

            var socket = undefined;
            var connectionStatusDom =
                document.getElementById("connection-status");
            var usernameInCookies = false;

            const loaded_css = new Set();
            const loaded_js = new Set();

            async function ensureJS(scriptname) {
                if (loaded_js.has(scriptname)) return;
                loaded_js.add(scriptname);
                await import(scriptname);
            }
            async function ensureCSS(sheetname) {
                if (loaded_css.has(sheetname)) return;
                loaded_css.add(sheetname);
                let link = document.createElement("link");
                link.setAttribute("rel", "stylesheet");
                link.setAttribute("href", sheetname);
                document.head.appendChild(link);
            }

            function getLogicalParent(element) {
                let p = element.parentElement;
                while (p !== null && !p.hasAttribute("data-key")) {
                    if (p.id === "screen") return null;
                    p = p.parentElement;
                }
                return p;
            }

            function lookupSlot(address) {
                let iter = screen.getElementById("screen");
                let slot = null;
                console.assert(address.startsWith("/"));
                address = address.slice(1);
                for (let segment of address.split("/")) {
                    slot = Array.from(
                        iter.querySelectorAll(`[data-key="${segment}"]`),
                    ).find((el) => getLogicalParent(el) === slot);
                    console.assert(slot.classList.contains("ga-slot"));
                    iter = slot.firstChild;
                }
                return slot;
            }
            function lookupComponent(address) {
                let slot = lookupSlot(address);
                return slot.firstChild;
            }

            const connectToServer = (serverAddress) => {
                const teamNr =
                    document.getElementById("playerId").value || "watch";
                const roomNr = document.getElementById("roomId").value;

                let DOMLoaded = fetch(
                    "http://" +
                        serverAddress +
                        "/r/" +
                        roomNr +
                        "/html?seat=" +
                        teamNr +
                        (usernameInCookies
                            ? ""
                            : "&username=" + encodeURIComponent(username)),
                ).then(async (content) => {
                    screen.getElementById("screen").innerHTML =
                        await content.text();
                    for (const elem of screen.querySelectorAll("script")) {
                        ensureJS(elem.src);
                    }
                });

                connectionStatusDom.textContent = "Connecting...";
                if (window.WebSocket === undefined) {
                    connectionStatusDom.textContent =
                        "WebSockets not supported!";
                    throw new Error("WebSockets not supported!");
                }

                socket = new WebSocket(
                    "ws://" +
                        serverAddress +
                        "/r/" +
                        roomNr +
                        "/ws/" +
                        teamNr +
                        (usernameInCookies
                            ? ""
                            : "?username=" + encodeURIComponent(username)),
                );
                socket.onopen = (event) => {
                    connectionStatusDom.textContent = "Connected";
                    initialized = false;
                    DOMLoaded.then(() => socket.send("?")); // In case we just reconnected and the server is waiting for us to answer a question
                    // TODO: we could already send the request and only wait before processing the response
                };
                socket.onclose = (event) => {
                    connectionStatusDom.textContent = "Not connected";
                };
                socket.onerror = console.error;

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    if (data.type === "choice") {
                        if (data.message) {
                            controlPanel.hidden = false;
                            const banner = document.createElement("span");
                            banner.innerText = data.message;
                            controlPanel.appendChild(banner);
                        }
                        if (data.slots) {
                            let slots = data.slots.map((id) => {
                                let e = lookupSlot(id);
                                e.setAttribute("data-chosen", id);
                                return e;
                            });
                            let eventListener = (event) => {
                                endChoices(
                                    event.currentTarget.getAttribute(
                                        "data-chosen",
                                    ),
                                );
                            };
                            let endChoices = (chosenComponent) => {
                                slots.forEach((c) => {
                                    c.removeEventListener(
                                        "click",
                                        eventListener,
                                    );
                                    c.classList.remove("clickable");
                                    c.removeAttribute("data-chosen");
                                });
                                controlPanel.innerHTML = "";
                                controlPanel.hidden = true;
                                if (
                                    chosenComponent.startsWith(CHAT_CHARACTER)
                                ) {
                                    console.warn(
                                        "Warning: sent data starts with /, the chat character",
                                    );
                                }
                                socket.send(chosenComponent);
                            };
                            slots.forEach((c) => {
                                c.addEventListener("click", eventListener);
                                c.classList.add("clickable");
                            });
                            if (data.special_options) {
                                controlPanel.hidden = false;
                                for (let option of data.special_options) {
                                    const button =
                                        document.createElement("button");
                                    button.textContent = option;
                                    button.addEventListener("click", (_event) =>
                                        endChoices(option),
                                    );
                                    controlPanel.appendChild(button);
                                }
                            }
                        } else if (
                            data.schema &&
                            data.schema.type == "string" &&
                            data.schema.enum
                        ) {
                            let form = document.createElement("form");
                            let btn_handler = (event) => {
                                event.preventDefault();
                                let answer = event.target.textContent;
                                socket.send(JSON.stringify(answer));
                                controlPanel.removeChild(form);
                                controlPanel.hidden = true;
                            };
                            for (let option of data.schema.enum) {
                                let btn = document.createElement("button");
                                btn.textContent = option;
                                btn.type = "submit";
                                btn.onclick = btn_handler;
                                form.appendChild(btn);
                            }
                            controlPanel.appendChild(form);
                            controlPanel.hidden = false;
                        } else if (data.schema) {
                            let formContent = makeWord(data.schema);
                            let form = document.createElement("form");
                            form.appendChild(formContent);
                            let submitButton = document.createElement("button");
                            submitButton.type = "submit";
                            submitButton.textContent = "Submit";
                            submitButton.classList.add("clickable");
                            form.appendChild(submitButton);
                            form.onsubmit = (event) => {
                                event.preventDefault();
                                let answer = readWord(formContent);
                                if (
                                    JSON.stringify(answer).startsWith(
                                        CHAT_CHARACTER,
                                    )
                                ) {
                                    console.warn(
                                        "Sent content will be interpreted as chat message",
                                    );
                                }
                                socket.send(JSON.stringify(answer));
                                controlPanel.removeChild(form);
                                controlPanel.hidden = true;
                            };
                            controlPanel.appendChild(form);
                            controlPanel.hidden = false;
                        } else
                            console.warn(
                                "Unrecognized server message: unrecognized choice type:",
                                data,
                            );
                    } else if (data.type === "chatcontrol") {
                        if (data.set === "on") {
                            chatInput.hidden = false;
                        } else {
                            chatInput.hidden = true;
                        }
                    } else if (data.type === "message") {
                        addLogLine(`<b>${data.sender}: </b>${data.text}`);
                    } else if (Array.isArray(data)) {
                        for (let diff of data) {
                            if (diff.op == "replace") {
                                let DOMConstructionSite =
                                    document.createElement("div");
                                DOMConstructionSite.innerHTML = diff.value;
                                let realElems = [];
                                for (const elem of DOMConstructionSite.children) {
                                    if (elem.nodeName == "script") {
                                        ensureJS(elem.src);
                                    } else if (elem.nodeName == "link") {
                                        console.assert(
                                            elem.rel == "stylesheet",
                                        );
                                        ensureCSS(elem.href);
                                    } else {
                                        realElems.push(elem);
                                    }
                                }
                                console.assert(
                                    realElems.length == 1,
                                    realElems,
                                );
                                lookupSlot(diff.path).replaceWith(realElems[0]);
                            } else if (diff.op == "add") {
                                if (diff.path.slice(-5) == "/hint") {
                                    const hinted = lookupComponent(
                                        diff.path.slice(0, -5),
                                    );
                                    let hint = [...hinted.childNodes].find(
                                        (node) =>
                                            node.classList?.contains("hint"),
                                    );
                                    if (hint === undefined) {
                                        hint = document.createElement("div");
                                        hint.classList.add("hint");
                                        hinted.appendChild(hint);
                                    }
                                    let hintText =
                                        document.createElement("span");
                                    hintText.innerText = diff.value;
                                    hint.appendChild(hintText);
                                } else {
                                    let DOMConstructionSite =
                                        document.createElement("div");
                                    DOMConstructionSite.innerHTML = diff.value; // TODO: find a more elegant way of parsing HTML
                                    diff.path = diff.path
                                        .split("/")
                                        .slice(0, -1)
                                        .join("/");
                                    let appendSite =
                                        diff.path === ""
                                            ? screen.getElementById("screen")
                                            : lookupComponent(diff.path);
                                    appendSite.append(
                                        DOMConstructionSite.firstChild,
                                    );
                                }
                            } else if (diff.op == "remove") {
                                let key = diff.path.split("/");
                                let child_num = key.pop();
                                let parent_component = lookupComponent(
                                    key.join("/"),
                                );
                                let child = parent_component.querySelector(
                                    `[data-key="${child_num}"]`,
                                );
                                if (parent_component.nodeName == "UL") {
                                    // For lists, remove both the slot and the component
                                    // TODO: also for dicts?
                                    child.remove();
                                } else {
                                    // Otherwise, make the slot empty
                                    child.innerText = "";
                                }
                            } else {
                                console.warn("Unrecognized diff: " + diff);
                            }
                        }
                    } else
                        console.warn(
                            "Unrecognized server message: unknown type:",
                            data,
                        );
                };
            };

            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get("room");
            document.getElementById("roomId").value = roomId || "";
            const playerId = urlParams.get("seat");
            document.getElementById("playerId").value = playerId || "";
            const serverUrl =
                urlParams.get("serverUrl") || window.location.host;
            document.getElementById("serverUrl").value = serverUrl;
            let username = urlParams.get("username");
            if (username === null) {
                if (
                    document.cookie
                        .split("; ")
                        .map((cookie) => cookie.split("=")[0])
                        .includes("username")
                ) {
                    username = document.cookie
                        .split("; ")
                        .find((cookie) => cookie.split("=")[0] === "username")
                        .split("=")[1];
                    usernameInCookies = true;
                } else {
                    username = "guest" + Math.round(Math.random() * 100);
                    window.history.pushState(
                        null,
                        null,
                        window.location +
                            (urlParams.size === 0 ? "?" : "&") +
                            "username=" +
                            username,
                    ); // Make a page reload keep the guestId
                }
            }
            function toggleLogin(loginUsername) {
                document.getElementById("login-form").hidden =
                    loginUsername !== undefined;
                document.getElementById("logout-form").hidden =
                    loginUsername === undefined;
                if (loginUsername !== undefined) {
                    document.getElementById(
                        "login-display-username",
                    ).textContent = loginUsername;
                }
            }

            function setActiveUsername(nextUsername, fromCookie = false) {
                username = nextUsername;
                usernameInCookies = fromCookie;
                document.getElementById("display-username").innerText =
                    username;
                if (fromCookie) {
                    toggleLogin(username);
                } else {
                    document.getElementById("login-username").value = username;
                    toggleLogin(undefined);
                }
            }

            function login() {
                const usernameForm =
                    document.getElementById("login-username").value;
                fetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ username: usernameForm }),
                }).then((_response) => {
                    setActiveUsername(usernameForm, true);
                });
            }

            function logout() {
                document.cookie =
                    "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/";
                setActiveUsername("guest" + Math.round(Math.random() * 100));
            }

            setActiveUsername(username, usernameInCookies);
            if (roomId) connectToServer(serverUrl);

            function sendChatLine(form) {
                let line = form.firstElementChild.value;
                socket.send(CHAT_CHARACTER + line);
                addLogLine("<b>You: </b>" + line);
            }
            function addLogLine(line) {
                let newLine = document.createElement("span");
                newLine.innerHTML = line;
                newLine.classList.add("log-message");
                logPanel.appendChild(newLine);
            }
        </script>
    </body>
</html>
