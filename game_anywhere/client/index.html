<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GameAnywhere</title>
        <link rel="stylesheet" href="css/main.css" />
        <script
            src="https://unpkg.com/react@18/umd/react.development.js"
            crossorigin
        ></script>
        <script
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
            crossorigin
        ></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script src="wizard/wizard.js"></script>
        <link href="wizard/wizard-robe.css" rel="stylesheet" />
        <script>
            "use strict";
            const e = React.createElement;
        </script>
    </head>
    <body class="app-page">
        <header class="app-header">
            <a class="brand" href="index.html">Game Anywhere</a>
            <section class="login-card">
                <form
                    id="login-form"
                    class="inline-form"
                    action="javascript:login()"
                >
                    <div class="field">
                        <label for="login-username">Username</label>
                        <input
                            id="login-username"
                            name="username"
                            type="text"
                        />
                    </div>
                    <button type="submit">Login</button>
                </form>
                <form
                    id="logout-form"
                    class="inline-form"
                    action="javascript:logout()"
                    hidden
                >
                    <div class="status-line">
                        <span>Logged in as</span>
                        <strong id="display-username"></strong>
                    </div>
                    <button class="secondary" type="submit">Log out</button>
                </form>
            </section>
        </header>

        <main class="app-shell">
            <section class="hero">
                <div class="hero-copy">
                    <h1>Game Anywhere</h1>
                </div>
                <div class="stack">
                    <section class="panel">
                        <h2>Start a New Game</h2>
                        <span id="connection-status" class="status-pill"></span>
                        <form
                            id="create-room-form"
                            class="form-stack"
                            action="/room"
                            method="post"
                            onsubmit="createNewRoom(event)"
                        >
                            <script>
                                const form = document.currentScript.parentNode;
                                fetch("/room", { method: "OPTIONS" })
                                    .then((res) => res.json())
                                    .then((json) => {
                                        let formContent = makeWord(json);
                                        form.insertBefore(
                                            formContent,
                                            form.childNodes[0],
                                        );
                                    });
                            </script>
                            <button type="submit">Start game</button>
                        </form>
                    </section>
                    <section class="panel">
                        <h2>Join a Game</h2>
                        <form
                            class="inline-form"
                            method="get"
                            action="lobby.html"
                        >
                            <div class="field">
                                <label for="join-room">Room ID</label>
                                <input id="join-room" type="text" name="room" />
                            </div>
                            <button type="submit">Join room</button>
                        </form>
                    </section>
                </div>
            </section>

            <section class="panel">
                <h2>Recent Games</h2>
                <div id="status-room-histories" class="history-table"></div>
            </section>
        </main>
        <script>
            function toggleLogin(username) {
                document.getElementById("login-form").hidden =
                    username !== undefined;
                document.getElementById("logout-form").hidden =
                    username === undefined;
                if (username !== undefined) {
                    document.getElementById("display-username").textContent =
                        username;
                }
            }
            function login() {
                let username_form =
                    document.getElementById("login-username").value;
                fetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ username: username_form }),
                }).then((_response) => {
                    toggleLogin(username_form);
                });
            }
            function logout() {
                document.cookie =
                    "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure; Path=/";
                toggleLogin(undefined);
            }
            const username = document.cookie
                .split("; ")
                .find((row) => row.startsWith("username="))
                ?.split("=")[1];
            if (username != null) {
                toggleLogin(username);
            }
            function createNewRoom(event) {
                event.preventDefault();
                const gameArgs = readWord(form.childNodes[0]);
                fetch("/room", {
                    method: "POST",
                    body: JSON.stringify(gameArgs),
                })
                    .then(async (response) => {
                        if (response.status >= 400) {
                            throw new Error(await response.text());
                        }
                        let location = response.headers.get("Location");
                        console.assert(location.startsWith("/lobby/"));
                        location = location.substring(7);
                        window.location.href = "lobby.html?room=" + location;
                    })
                    .then(async (response) => {
                        if (response.status >= 400) {
                            throw new Error(await response.text());
                        }
                        let location = response.headers.get("Location");
                        console.assert(location.startsWith("/lobby/"));
                        location = location.substring(7);
                        window.location.href = "lobby.html?room=" + location;
                    })
                    .catch(errorPopup);
            }
            const historyRoot = ReactDOM.createRoot(
                document.getElementById("status-room-histories"),
            );
            var knownHistory;
            // TODO: move to an actual front-end reactive framework instead of just using React for the convenience syntax
            function renderHistory(games) {
                if (games.length == 0)
                    historyRoot.render(
                        e(
                            "div",
                            { className: "empty-state" },
                            "No games saved",
                        ),
                    );
                else
                    historyRoot.render(
                        e("table", {}, [
                            e(
                                "tbody",
                                {},
                                [
                                    e("tr", { key: "header" }, [
                                        e("th", {}, "Game"),
                                        e("th", {}, "Players"),
                                        e("th", {}, "Started"),
                                        e("th", {}, "Ended"),
                                        e("th", {}, "Winner"),
                                        e("th", {}, "Replay"),
                                    ]),
                                ].concat(
                                    Object.entries(games).map((game) =>
                                        e("tr", { key: game[0] }, [
                                            e(
                                                "td",
                                                { key: "game" },
                                                game[1].game,
                                            ),
                                            e(
                                                "td",
                                                { key: "players" },
                                                Object.values(
                                                    game[1].players,
                                                ).join(", "),
                                            ),
                                            e(
                                                "td",
                                                { key: "start" },
                                                new Date(
                                                    game[1].started * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "end" },
                                                new Date(
                                                    game[1].ended * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "winner" },
                                                game[1].players[
                                                    game[1].summary.winner
                                                ],
                                            ),
                                            e(
                                                "td",
                                                { key: "replay" },
                                                game[1].summary.replay !==
                                                    undefined
                                                    ? e(
                                                          "a",
                                                          {
                                                              key: "a",
                                                              href: `replay.html?game=${game[0]}`,
                                                          },
                                                          "Replay",
                                                      )
                                                    : "",
                                            ),
                                        ]),
                                    ),
                                ),
                            ),
                        ]),
                    );
            }
            function loadHistory() {
                fetch("/logs/list")
                    .then((response) => response.json())
                    .then((games) => {
                        knownHistory = games;
                        renderHistory(games);
                    });
            }
            loadHistory();
            const sseSource = new EventSource("/watch");
            sseSource.onmessage = (msg) => {
                let data = JSON.parse(msg.data);
                let historyChanged = false;
                for (let update of data) {
                    let key = update.key.split("/");
                    console.assert(
                        key[0] == "",
                        "Key does not start with /:",
                        update.key,
                    );
                    key = key.slice(1);
                    if (update.op == "add") {
                        if (key[0] == "s") {
                            console.assert(key.length == 2);
                            let hist_id = Number.parseInt(key[1]);
                            knownHistory[hist_id] = update.value;
                            historyChanged = true;
                        } else {
                            console.warn("Unknown key " + key[0]);
                        }
                    } else if (update.op == "replace") {
                        console.warn("Unknown key " + key);
                    } else {
                        console.warn(
                            `Unknown operation: ${JSON.stringify(update)}`,
                        );
                    }
                    if (historyChanged) renderHistory(knownHistory);
                }
            };
            function errorPopup(message) {
                alert(message);
            }
        </script>
    </body>
</html>
