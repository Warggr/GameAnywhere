<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GameAnywhere</title>
        <link rel="stylesheet" href="css/main.css" />
        <script
            src="https://unpkg.com/react@18/umd/react.development.js"
            crossorigin
        ></script>
        <script
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
            crossorigin
        ></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script>
            "use strict";
            const e = React.createElement;
        </script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <h1 class="navbar-brand">Game Anywhere</h1>
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form
                    id="login-form"
                    class="form-inline my-2 my-lg-0"
                    action="javascript:login()"
                >
                    <label for="username">Username</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        class="form-control mr-sm-2"
                    />
                    <button
                        type="submit"
                        class="btn btn-outline-success my-2 my-sm-0"
                    >
                        Login
                    </button>
                </form>
                <form
                    id="logout-form"
                    class="form-inline my-2 my-lg-0"
                    action="javascript:logout()"
                    hidden
                >
                    <p>Logged in as <span id="display-username"></span></p>
                    <button type="submit">Log out</button>
                </form>
            </div>
        </nav>
        <div class="indexMainDiv">
            <span id="connection-status"></span>
            <div id="status-rooms"></div>
            <button onclick="loadRooms()">Reload</button>
            <form action="javascript:createNewRoom();">
                <select id="gameType">
                    <script>
                        fetch("/room", { method: "OPTIONS" })
                            .then((res) => res.json())
                            .then((json) =>
                                json.enum.forEach((val) => {
                                    let optionDOM =
                                        document.createElement("option");
                                    optionDOM.name = val;
                                    optionDOM.textContent = val;
                                    document
                                        .getElementById("gameType")
                                        .appendChild(optionDOM);
                                }),
                            );
                    </script>
                </select>
                <input type="text" name="game_args" />
                <button type="submit">Start a new game</button>
            </form>
            <form method="get" action="player.html">
                <input type="text" name="room" />
                <input type="text" name="seat" />
                <button type="submit">Join a game with a code</button>
            </form>
            <div id="status-room-histories"></div>
        </div>
        <script>
            function toggleLogin(username) {
                document.getElementById("login-form").hidden =
                    username !== undefined;
                document.getElementById("logout-form").hidden =
                    username === undefined;
                if (username !== undefined) {
                    document.getElementById("display-username").textContent =
                        username;
                }
            }
            function login() {
                let username_form = document.getElementById("username").value;
                fetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ username: username_form }),
                }).then((_response) => {
                    toggleLogin(username_form);
                });
            }
            function logout() {
                document.cookie =
                    "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure; Path=/";
                toggleLogin(undefined);
            }
            const username = document.cookie
                .split("; ")
                .find((row) => row.startsWith("username"))
                ?.split("=")[1];
            if (username != null) {
                toggleLogin(username);
            }
            function createNewRoom() {
                const gameType = document.getElementById("gameType").value;
                const gameArgs =
                    document.getElementById("gameType").nextElementSibling
                        .value;
                fetch("/room", {
                    method: "POST",
                    body: JSON.stringify({ game: gameType, args: gameArgs }),
                })
                    .then(async (response) => {
                        if (response.status >= 400) {
                            throw new Error(await response.text());
                        }
                    })
                    .then(loadRooms)
                    .catch(errorPopup);
            }
            const roomsRoot = ReactDOM.createRoot(
                document.getElementById("status-rooms"),
            );
            const historyRoot = ReactDOM.createRoot(
                document.getElementById("status-room-histories"),
            );
            var knownRooms, knownHistory;
            // TODO: move to an actual front-end reactive framework instead of just using React for the convenience syntax
            function renderRooms(rooms) {
                if (rooms.length == 0) roomsRoot.render("(no rooms)");
                else
                    roomsRoot.render(
                        Object.entries(rooms).map((room) =>
                            e("div", { key: room[0] }, [
                                e("h3", { key: "h3" }, "Room " + room[0]),
                                e(
                                    "a",
                                    {
                                        key: "a",
                                        href: `player.html?room=${room[0]}`,
                                    },
                                    "Watch",
                                ),
                                e(
                                    "p",
                                    { key: "p" },
                                    room[1].spectators + " spectators",
                                ),
                                e(
                                    "table",
                                    { key: "div" },
                                    e(
                                        "tbody",
                                        {},
                                        Object.entries(room[1].seats).map(
                                            (seat) =>
                                                e(
                                                    "tr",
                                                    { key: seat[0] },
                                                    e(
                                                        "td",
                                                        { key: "name" },
                                                        seat[1].username,
                                                    ),
                                                    e(
                                                        "td",
                                                        { key: "state" },
                                                        seat[1].state == "FREE"
                                                            ? e(
                                                                  "a",
                                                                  {
                                                                      href: `player.html?room=${
                                                                          room[0]
                                                                      }&seat=${Number(
                                                                          seat[0],
                                                                      )}`,
                                                                  },
                                                                  "Join",
                                                              )
                                                            : e(
                                                                  "span",
                                                                  {},
                                                                  seat[1].state,
                                                              ),
                                                    ),
                                                ),
                                        ),
                                    ),
                                ),
                            ]),
                        ),
                    );
            }
            function renderHistory(games) {
                if (games.length == 0) historyRoot.render("(no games saved)");
                else
                    historyRoot.render(
                        e("table", {}, [
                            e(
                                "tbody",
                                {},
                                [
                                    e("tr", { key: "header" }, [
                                        e("th", {}, "Game"),
                                        e("th", {}, "Players"),
                                        e("th", {}, "Started"),
                                        e("th", {}, "Ended"),
                                        e("th", {}, "Winner"),
                                        e("th", {}, "Replay"),
                                    ]),
                                ].concat(
                                    Object.entries(games).map((game) =>
                                        e("tr", { key: game[0] }, [
                                            e(
                                                "td",
                                                { key: "game" },
                                                game[1].game,
                                            ),
                                            e(
                                                "td",
                                                { key: "players" },
                                                Object.values(
                                                    game[1].players,
                                                ).join(", "),
                                            ),
                                            e(
                                                "td",
                                                { key: "start" },
                                                new Date(
                                                    game[1].started * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "end" },
                                                new Date(
                                                    game[1].ended * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "winner" },
                                                game[1].players[
                                                    game[1].summary.winner
                                                ],
                                            ),
                                            e(
                                                "td",
                                                { key: "replay" },
                                                game[1].summary.replay !==
                                                    undefined
                                                    ? e(
                                                          "a",
                                                          {
                                                              key: "a",
                                                              href: `replay.html?game=${game[0]}`,
                                                          },
                                                          "Replay",
                                                      )
                                                    : "",
                                            ),
                                        ]),
                                    ),
                                ),
                            ),
                        ]),
                    );
            }
            function loadRooms() {
                fetch("/room/list")
                    .then((response) => response.json())
                    .then((rooms) => {
                        knownRooms = rooms;
                        renderRooms(rooms);
                    });
            }
            function loadHistory() {
                fetch("/logs/list")
                    .then((response) => response.json())
                    .then((games) => {
                        knownHistory = games;
                        renderHistory(games);
                    });
            }
            loadRooms();
            loadHistory();
            const sseSource = new EventSource("/watch");
            sseSource.onmessage = (msg) => {
                let data = JSON.parse(msg.data);
                let roomsChanged = false,
                    historyChanged = false;
                for (let update of data) {
                    let key = update.key.split("/");
                    console.assert(
                        key[0] == "",
                        "Key does not start with /:",
                        update.key,
                    );
                    key = key.slice(1);
                    if (update.op == "add") {
                        if (key[0] == "r") {
                            console.assert(key.length == 2);
                            let room_id = Number.parseInt(key[1]);
                            knownRooms[room_id] = update.value;
                            roomsChanged = true;
                        } else if (key[0] == "s") {
                            console.assert(key.length == 2);
                            let hist_id = Number.parseInt(key[1]);
                            knownHistory[hist_id] = update.value;
                            historyChanged = true;
                        } else {
                            console.warn("Unknown key " + key[0]);
                        }
                    } else if (update.op == "replace") {
                        if (key[0] == "r") {
                            let room_id = Number.parseInt(key[1]);
                            if (key[2] == "seats") {
                                console.assert(key.length == 5);
                                let seat_id = Number.parseInt(key[3]);
                                knownRooms[room_id].seats[seat_id][key[4]] =
                                    update.value;
                            } else if (key[2] == "spectators") {
                                console.assert(key.length == 3);
                                knownRooms[room_id].spectators = update.value;
                            }
                            roomsChanged = true;
                        } else {
                            console.warn("Unknown key " + key);
                        }
                    } else {
                        console.warn(
                            `Unknown operation: ${JSON.stringify(update)}`,
                        );
                    }
                    if (roomsChanged) renderRooms(knownRooms);
                    if (historyChanged) renderHistory(knownHistory);
                }
            };
            function errorPopup(message) {
                alert(message);
            }
        </script>
    </body>
</html>
