<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GameAnywhere</title>
        <link rel="stylesheet" href="css/main.css" />
        <script
            src="https://unpkg.com/react@18/umd/react.development.js"
            crossorigin
        ></script>
        <script
            src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
            crossorigin
        ></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script src="wizard/wizard.js"></script>
        <link href="wizard/wizard-robe.css" rel="stylesheet" />
        <script>
            "use strict";
            const e = React.createElement;
        </script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <h1 class="navbar-brand">Game Anywhere</h1>
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <form
                    id="login-form"
                    class="form-inline my-2 my-lg-0"
                    action="javascript:login()"
                >
                    <label for="username">Username</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        class="form-control mr-sm-2"
                    />
                    <button
                        type="submit"
                        class="btn btn-outline-success my-2 my-sm-0"
                    >
                        Login
                    </button>
                </form>
                <form
                    id="logout-form"
                    class="form-inline my-2 my-lg-0"
                    action="javascript:logout()"
                    hidden
                >
                    <p>Logged in as <span id="display-username"></span></p>
                    <button type="submit">Log out</button>
                </form>
            </div>
        </nav>
        <div class="indexMainDiv">
            <span id="connection-status"></span>
            <form action="/room" method="/post" onsubmit="createNewRoom(event)">
                <script>
                    console.log(document.currentScript);
                    const form = document.currentScript.parentNode;
                    fetch("/room", { method: "OPTIONS" })
                        .then((res) => res.json())
                        .then((json) => {
                            let formContent = makeWord(json);
                            form.insertBefore(formContent, form.childNodes[0]);
                        });
                </script>
                <button type="submit">Start a new game</button>
            </form>
            <form method="get" action="player.html">
                <input type="text" name="room" />
                <input type="text" name="seat" />
                <button type="submit">Join a game with a code</button>
            </form>
            <div id="status-room-histories"></div>
        </div>
        <script>
            function toggleLogin(username) {
                document.getElementById("login-form").hidden =
                    username !== undefined;
                document.getElementById("logout-form").hidden =
                    username === undefined;
                if (username !== undefined) {
                    document.getElementById("display-username").textContent =
                        username;
                }
            }
            function login() {
                let username_form = document.getElementById("username").value;
                fetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ username: username_form }),
                }).then((_response) => {
                    toggleLogin(username_form);
                });
            }
            function logout() {
                document.cookie =
                    "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=None; Secure; Path=/";
                toggleLogin(undefined);
            }
            const username = document.cookie
                .split("; ")
                .find((row) => row.startsWith("username"))
                ?.split("=")[1];
            if (username != null) {
                toggleLogin(username);
            }
            function createNewRoom(event) {
                event.preventDefault();
                const gameArgs = readWord(form.childNodes[0]);
                fetch("/room", {
                    method: "POST",
                    body: JSON.stringify(gameArgs),
                })
                    .then(async (response) => {
                        if (response.status >= 400) {
                            throw new Error(await response.text());
                        }
                        let location = response.headers.get("Location");
                        console.assert(location.startsWith("/lobby/"));
                        location = location.substring(7);
                        window.location.href = "lobby.html?room=" + location;
                    })
                    .then(async (response) => {
                        if (response.status >= 400) {
                            throw new Error(await response.text());
                        }
                        let location = response.headers.get("Location");
                        console.assert(location.startsWith("/lobby/"));
                        location = location.substring(7);
                        window.location.href = "lobby.html?room=" + location;
                    })
                    .catch(errorPopup);
            }
            const historyRoot = ReactDOM.createRoot(
                document.getElementById("status-room-histories"),
            );
            var knownHistory;
            // TODO: move to an actual front-end reactive framework instead of just using React for the convenience syntax
            function renderHistory(games) {
                if (games.length == 0) historyRoot.render("(no games saved)");
                else
                    historyRoot.render(
                        e("table", {}, [
                            e(
                                "tbody",
                                {},
                                [
                                    e("tr", { key: "header" }, [
                                        e("th", {}, "Game"),
                                        e("th", {}, "Players"),
                                        e("th", {}, "Started"),
                                        e("th", {}, "Ended"),
                                        e("th", {}, "Winner"),
                                        e("th", {}, "Replay"),
                                    ]),
                                ].concat(
                                    Object.entries(games).map((game) =>
                                        e("tr", { key: game[0] }, [
                                            e(
                                                "td",
                                                { key: "game" },
                                                game[1].game,
                                            ),
                                            e(
                                                "td",
                                                { key: "players" },
                                                Object.values(
                                                    game[1].players,
                                                ).join(", "),
                                            ),
                                            e(
                                                "td",
                                                { key: "start" },
                                                new Date(
                                                    game[1].started * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "end" },
                                                new Date(
                                                    game[1].ended * 1000,
                                                ).toLocaleDateString(),
                                            ),
                                            e(
                                                "td",
                                                { key: "winner" },
                                                game[1].players[
                                                    game[1].summary.winner
                                                ],
                                            ),
                                            e(
                                                "td",
                                                { key: "replay" },
                                                game[1].summary.replay !==
                                                    undefined
                                                    ? e(
                                                          "a",
                                                          {
                                                              key: "a",
                                                              href: `replay.html?game=${game[0]}`,
                                                          },
                                                          "Replay",
                                                      )
                                                    : "",
                                            ),
                                        ]),
                                    ),
                                ),
                            ),
                        ]),
                    );
            }
            function loadHistory() {
                fetch("/logs/list")
                    .then((response) => response.json())
                    .then((games) => {
                        knownHistory = games;
                        renderHistory(games);
                    });
            }
            loadHistory();
            const sseSource = new EventSource("/watch");
            sseSource.onmessage = (msg) => {
                let data = JSON.parse(msg.data);
                let historyChanged = false;
                for (let update of data) {
                    let key = update.key.split("/");
                    console.assert(
                        key[0] == "",
                        "Key does not start with /:",
                        update.key,
                    );
                    key = key.slice(1);
                    if (update.op == "add") {
                        if (key[0] == "s") {
                            console.assert(key.length == 2);
                            let hist_id = Number.parseInt(key[1]);
                            knownHistory[hist_id] = update.value;
                            historyChanged = true;
                        } else {
                            console.warn("Unknown key " + key[0]);
                        }
                    } else if (update.op == "replace") {
                        console.warn("Unknown key " + key);
                    } else {
                        console.warn(
                            `Unknown operation: ${JSON.stringify(update)}`,
                        );
                    }
                    if (historyChanged) renderHistory(knownHistory);
                }
            };
            function errorPopup(message) {
                alert(message);
            }
        </script>
    </body>
</html>
