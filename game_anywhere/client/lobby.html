<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lobby | GameAnywhere</title>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body class="app-page">
        <header class="app-header">
            <a class="brand" href="index.html">Game Anywhere</a>
        </header>

        <main id="app" class="app-shell">
            <section class="hero">
                <div class="hero-copy">
                    <h1>{{ game.game || "Lobby" }}</h1>
                </div>

                <aside class="sidebar">
                    <section class="connection-card">
                        <h2>Server Connection</h2>
                        <div class="meta-list">
                            <div class="meta-row">
                                <span>Status</span>
                                <strong>{{ connection_status }}</strong>
                            </div>
                            <div class="meta-row">
                                <span>Server</span>
                                <strong>{{ server_host }}</strong>
                            </div>
                            <div class="meta-row">
                                <span>Room</span>
                                <strong>{{ room_id || "Unknown" }}</strong>
                            </div>
                        </div>
                    </section>

                    <section class="login-card">
                        <h2>Login</h2>
                        <form
                            v-if="username === undefined"
                            class="form-stack"
                            @submit.prevent="login"
                        >
                            <div class="field">
                                <label for="login-username">Username</label>
                                <input
                                    id="login-username"
                                    type="text"
                                    v-model="login_username"
                                />
                            </div>
                            <button type="submit">Login</button>
                        </form>
                        <form
                            v-else
                            class="form-stack"
                            @submit.prevent="logout"
                        >
                            <div class="status-line">
                                <span>Logged in as</span>
                                <strong>{{ username }}</strong>
                            </div>
                            <button class="secondary" type="submit">
                                Log out
                            </button>
                        </form>
                    </section>
                </aside>
            </section>

            <section class="page-grid">
                <div class="panel">
                    <h2>Invite Link</h2>
                    <div class="copyable-link">
                        <input type="text" :value="invite_link()" readonly />
                        <button type="button" @click="copyInviteLink($event)">
                            Copy
                        </button>
                    </div>
                </div>

                <div class="panel">
                    <h2>Players</h2>
                    <div class="seats-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Username</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    v-for="(user, seat) in game.spectators"
                                    :key="seat"
                                    :class="{ 'own-player-row': isCurrentUser(seat) }"
                                >
                                    <td>
                                        <form
                                            v-if="isCurrentUser(seat)"
                                            class="player-name-form"
                                            @submit.prevent="submitNameChange"
                                        >
                                            <input
                                                :id="`player-name-${seat}`"
                                                type="text"
                                                v-model="name_draft"
                                                @focus="name_editing = true"
                                                @blur="finishNameEdit"
                                                @keydown.esc.prevent="resetNameDraft"
                                                aria-label="Your username"
                                            />
                                            <span class="status-pill">You</span>
                                        </form>
                                        <span v-else
                                            >{{ user.name || "Guest" }}</span
                                        >
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <form
                        v-if="ready_to_start"
                        class="form-stack"
                        @submit="finalizeRoom($event)"
                    >
                        <button type="submit">Start game</button>
                    </form>
                    <span v-else class="status-pill"
                        >Still waiting for {{ waiting_count }} players...</span
                    >
                </div>
            </section>
        </main>
        <script type="module">
            import { createApp } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";
            import { applyPatch } from "https://unpkg.com/fast-json-patch/index.mjs";

            createApp({
                data() {
                    const params = new URLSearchParams(window.location.search);
                    const cookieUsername = document.cookie
                        .split("; ")
                        .find((row) => row.startsWith("username="))
                        ?.split("=")[1];
                    return {
                        room_id: params.get("room"),
                        seat_id: undefined,
                        server_host: window.location.host,
                        connection_status: "Connecting...",
                        username: cookieUsername,
                        login_username: cookieUsername,
                        game: {
                            spectators: [],
                            num_players: undefined,
                            game: undefined,
                            you: undefined,
                        },
                        name_draft: "",
                        name_editing: false,
                    };
                },
                computed: {
                    player_count() {
                        return this.game.spectators.length;
                    },
                    expected_count() {
                        return this.game.num_players?.const;
                    },
                    waiting_count() {
                        if (this.expected_count === undefined) return 0;
                        return Math.max(
                            this.expected_count - this.player_count,
                            0,
                        );
                    },
                    ready_to_start() {
                        return (
                            this.expected_count !== undefined &&
                            this.expected_count == this.player_count
                        );
                    },
                    current_user() {
                        const index = this.game.you?.spectator_index;
                        if (index === undefined) return undefined;
                        return this.game.spectators[index];
                    },
                },

                async mounted() {
                    const socket_url = new URL(
                        "/lobby/" + this.room_id + "/ws/watch",
                        window.location.href,
                    );
                    if (this.login_username) {
                        socket_url.searchParams.append(
                            "username",
                            this.login_username,
                        );
                    }
                    const socket = new WebSocket(socket_url);

                    socket.onopen = (event) => {
                        this.connection_status = "Connected";
                    };
                    socket.onerror = console.error;
                    socket.onclose = (event) => {
                        this.connection_status = "Disconnected";
                    };
                    socket.onmessage = async (message) => {
                        this.handle_message(JSON.parse(message.data));
                    };
                    this.socket = socket;
                },
                methods: {
                    handle_message(message) {
                        if (message.type == "finalize") {
                            if (message.seat_id !== undefined) {
                                console.log("Set seat_id:", message.seat_id);
                                this.seat_id = message.seat_id;
                            } else {
                                console.assert(this.seat_id !== undefined);
                                let url = new URL(
                                    "player.html",
                                    window.location.href,
                                );
                                console.assert(
                                    message.location.startsWith("/r/"),
                                );
                                const room_id = message.location.substring(3);
                                url.searchParams.append("seat", this.seat_id);
                                url.searchParams.append("room", room_id);
                                window.location.replace(url);
                            }
                            return;
                        }
                        const oldIndex = this.game.you?.spectator_index;
                        const removedBeforeMe = message.patch.filter(
                            (patch) =>
                                patch.op === "remove" &&
                                patch.path.startsWith("/spectators/") &&
                                Number(patch.path.split("/")[2]) < oldIndex,
                        ).length;
                        this.game = applyPatch(
                            this.game,
                            message.patch,
                        ).newDocument;
                        if (removedBeforeMe > 0) {
                            this.game.you.spectator_index =
                                oldIndex - removedBeforeMe;
                        }
                        if (!this.name_editing) {
                            this.resetNameDraft();
                        }
                    },
                    invite_link() {
                        let url = new URL(window.location.href);
                        url.searchParams.delete("seat");
                        return url;
                    },
                    async copyInviteLink(event) {
                        const link = this.invite_link().toString();
                        try {
                            await navigator.clipboard.writeText(link);
                        } catch (err) {
                            const input =
                                event.target.parentNode.firstElementChild;
                            input.select();
                            document.execCommand("copy");
                        }
                    },
                    login() {
                        fetch("/login", {
                            method: "POST",
                            body: JSON.stringify({
                                username: this.login_username,
                            }),
                        }).then((_response) => {
                            this.username = this.login_username;
                        });
                    },
                    logout() {
                        document.cookie =
                            "username=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/";
                        this.username = undefined;
                    },
                    isCurrentUser(seat) {
                        return seat === this.game.you?.spectator_index;
                    },
                    finishNameEdit() {
                        this.name_editing = false;
                        this.submitNameChange();
                    },
                    resetNameDraft() {
                        this.name_draft =
                            this.current_user?.name ||
                            this.game.you?.name ||
                            "";
                    },
                    submitNameChange() {
                        this.name_editing = false;
                        const newName = this.name_draft.trim();
                        const currentName = this.current_user?.name || "";
                        if (newName === "" || newName === currentName) {
                            this.resetNameDraft();
                            return;
                        }
                        this.socket.send(
                            JSON.stringify({
                                channel: "players",
                                op: "replace",
                                path: "/name",
                                value: newName,
                            }),
                        );
                        this.resetNameDraft(); // wait for the server to confirm the name change
                        //this.username = newName;
                    },
                    finalizeRoom(event) {
                        event.preventDefault();
                        this.socket.send(
                            JSON.stringify({
                                channel: "players",
                                op: "finalize",
                            }),
                        );
                    },
                },
            }).mount("#app");
        </script>
    </body>
</html>
